name: template

services:
  db:
#if (postgres)
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: Template
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-template-local}
    ports:
      - "5432:5432"
    volumes:
      - template-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
#elif (sqlserver)
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-Template-Local-123}
    ports:
      - "1433:1433"
    volumes:
      - template-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
#else
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: Template
      MYSQL_USER: admin
      MYSQL_PASSWORD: ${DB_PASSWORD:-template-local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-template-local-root}
    ports:
      - "3306:3306"
    volumes:
      - template-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u \"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
#endif

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
#if (postgres)
      ConnectionStrings__DbConnection: Host=db;Port=5432;Database=Template;Username=admin;Password=${DB_PASSWORD:-template-local}
#elif (sqlserver)
      ConnectionStrings__DbConnection: Server=db,1433;Database=Template;User Id=sa;Password=${DB_PASSWORD:-Template-Local-123};TrustServerCertificate=True
#else
      ConnectionStrings__DbConnection: Server=db;Port=3306;Database=Template;User=admin;Password=${DB_PASSWORD:-template-local}
#endif
#if (auth)
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-template-local-jwt-signing-key-change-me}
#endif
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  template-data:
