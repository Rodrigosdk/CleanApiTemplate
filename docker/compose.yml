name: template

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: Template
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-template-local}
    ports:
      - "5432:5432"
    volumes:
      - template-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DbConnection: Host=db;Port=5432;Database=Template;Username=admin;Password=${DB_PASSWORD:-template-local}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  template-data:
